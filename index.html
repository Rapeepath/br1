<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="แค็ตตาล็อกสายพันธุ์แมวยอดนิยมในไทย 12 สายพันธุ์ พร้อมนิสัย การดูแล สุขภาพ และราคาโดยประมาณ" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Maew แค็ตตาล็อกสายพันธุ์แมว</title>
    <script>
      // Links from before real URLs (#/breeds/x) open the same page at its real address.
      if (location.hash.indexOf('#/') === 0) history.replaceState(null, '', location.hash.slice(1) || '/')
      // The app positions the page itself on every route change; a reload starts at the top rather than
      // racing the browser's scroll restoration against the first render.
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      // Apply a remembered theme before first paint, so dark mode never flashes light or animates in.
      try {
        var t = localStorage.getItem('maew.theme')
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
